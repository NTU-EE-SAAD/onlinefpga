# Certificate bootstrap only. The portal stays on its existing listener until TLS is ready.
server {
    listen 80;
    listen [::]:80;
    server_name mks.ntuee.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/onlinefpga-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "FPGA reservation HTTPS setup in progress.\n";
    }
}
