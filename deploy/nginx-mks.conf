# Production vhost for mks.ntuee.org. Keep FPGA SSH/Jupyter behind the portal.
# The installer substitutes @CERTIFICATE@ and @PRIVATE_KEY@ with real paths.
map $http_upgrade $fpga_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mks.ntuee.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/onlinefpga-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://mks.ntuee.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mks.ntuee.org;
    if ($host != mks.ntuee.org) { return 444; }
    ssl_certificate @CERTIFICATE@;
    ssl_certificate_key @PRIVATE_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FPGA_TLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    # Cloudflare published ranges, verified 2026-10-07:
    # https://www.cloudflare.com/ips-v4 and /ips-v6
    # Trust the client-IP header only when the TCP peer is Cloudflare.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    client_max_body_size 32k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host mks.ntuee.org;
        proxy_set_header X-Forwarded-Host mks.ntuee.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location /lab/ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fpga_connection_upgrade;
        proxy_set_header Host mks.ntuee.org;
        proxy_set_header X-Forwarded-Host mks.ntuee.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
