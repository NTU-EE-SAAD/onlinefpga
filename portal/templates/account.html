{% extends 'base.html' %}
{% block title %}帳號設定{% endblock %}
{% block content %}
<div class="page-title"><p class="eyebrow">ACCOUNT</p><h1>帳號設定</h1><p class="lead">{{ g.user.name }} · {{ g.user.email }}</p></div>
<section class="panel narrow-panel"><h2>更新密碼</h2><p class="muted">更新後，所有裝置都需要重新登入。</p><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>目前密碼<input name="current_password" type="password" autocomplete="current-password" required maxlength="128"></label><label>新密碼<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><label>確認新密碼<input name="password_confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><button class="button" type="submit">更新密碼 →</button></form></section>
{% endblock %}
